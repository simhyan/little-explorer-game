@keyframes glow{to{opacity:.45;transform:scale(1.1)}}@keyframes embers{to{background-position:30px -90px;opacity:.1}}
.app{position:relative;z-index:1;max-width:1240px;margin:auto;padding:20px 26px 50px}
.top{position:relative;background:linear-gradient(180deg,#6c452b,#38251e);border:3px solid #d5a765;border-bottom:8px solid #251a17;border-radius:20px;padding:18px 23px;box-shadow:0 9px 25px #0009,inset 0 0 0 3px #8d5d38}
.top:before{content:"✦  THE LITTLE EXPLORER TAVERN  ✦";display:block;color:#e8bf7c;font-size:10px;letter-spacing:.2em;font-weight:900}
.logo{color:#ffe5a8;font-size:clamp(24px,3vw,36px);font-weight:1000;letter-spacing:-.05em;text-shadow:0 3px 0 #362016}
.sub{color:#e0bd88;font-weight:800}.pill{background:linear-gradient(#e4bd77,#ae783f);border:2px solid #f5d699;color:#3f2819;box-shadow:0 4px 0 #6b452b}
.screen{margin-top:28px}.eyebrow{color:#f7cf8a;text-shadow:0 2px 5px #000;font-weight:950}
.hero{color:#ffebba;text-shadow:0 3px 0 #6e3d25,0 6px 16px #000c;font-weight:1000;letter-spacing:-.055em}
.muted{color:#ffe9c8;text-shadow:0 2px 5px #000d;font-weight:750}
.profiles,.subjects,.answers{gap:15px}
.profile,.subject,.answer{background:linear-gradient(150deg,#8b603c,#513426);color:#ffedc6;border:3px solid #c59354;border-bottom:7px solid #291b19;border-radius:18px;box-shadow:0 7px 22px #0009,inset 0 0 0 2px #e4b7784f;transition:transform .16s,filter .16s}
.profile:hover,.subject:hover,.answer:hover{transform:translateY(-3px);filter:brightness(1.16)}
.profile:active,.subject:active,.answer:active{transform:translateY(2px)}
.profile{min-height:160px}.name,.subject .label{color:#ffe5ab}.meta,.subject .desc{color:#e7cba1}
.subject{min-height:170px;position:relative;overflow:hidden;padding:22px}
.subject:before{content:"";position:absolute;inset:9px;border:1.5px solid #e6b77a60;border-radius:12px;pointer-events:none}
.subject:after{content:"✧";position:absolute;right:22px;top:15px;color:#e9c583;font-size:21px}
.subject:nth-child(4n+2){background:linear-gradient(140deg,#79513a,#4a3028)}
.subject:nth-child(4n+3){background:linear-gradient(140deg,#53645b,#293f3c)}
.subject:nth-child(4n+4){background:linear-gradient(140deg,#725052,#412b36)}
.subject .emoji{position:relative;display:grid;place-items:center;width:66px;height:66px;background:#2b2420b8;border:2px solid #c99c5d;border-radius:16px;font-size:38px;box-shadow:inset 0 0 20px #0005}
.subject .label{position:relative;font-size:23px;margin-top:15px}.subject .desc{position:relative}
.subject.all{background:linear-gradient(135deg,#a67536,#694321);border-color:#f3ce81}
.subject.all .label,.subject.all .desc{color:#fff1c6}
.stat{background:linear-gradient(#6d482e,#3b2922);color:#ffe6a6;border:2px solid #d7a767;border-bottom:5px solid #1e1918;border-radius:14px;box-shadow:0 4px 12px #0008;font-weight:950}
.progress{background:#2c251e;border:3px solid #bd8c4f;height:17px;border-radius:20px;box-shadow:0 5px 10px #0008}
.bar{background:linear-gradient(90deg,#57c3a0,#ffd075);box-shadow:0 0 12px #ffc366}
.card{position:relative;background:linear-gradient(155deg,#5b3a29,#2d2523);border:8px ridge #b4814c;border-radius:24px;box-shadow:0 15px 40px #000c,inset 0 0 0 4px #3c261d;padding:clamp(17px,3.5vw,35px)}
.card:before{content:"";position:absolute;inset:13px;background:linear-gradient(160deg,#e3c28b,#f3dfad 40%,#d7b782);border:3px solid #8b5a37;border-radius:12px;box-shadow:inset 0 0 40px #9b613650;pointer-events:none}
.card:after{content:"✦     ⚔     ✦";position:absolute;top:15px;left:50%;transform:translateX(-50%);color:#8c613b;font-size:12px;letter-spacing:7px;pointer-events:none}
.card>*{position:relative;z-index:1}
.card .question{color:#3c3026;font-weight:1000;text-shadow:0 1px #fff4d2;line-height:1.45}
.card .question-icon{filter:drop-shadow(0 6px 5px #6d482c5c)}
.card .muted{color:#72543b;text-shadow:none}
.answer{background:linear-gradient(180deg,#fff1c7,#e1bc7d);color:#4c3322;border:3px solid #ab7945;border-bottom:6px solid #79502f;min-height:96px;box-shadow:0 6px 12px #62402235;font-weight:950}
.answer:hover:not(:disabled){background:linear-gradient(#fff5d7,#f2ce89);filter:none;border-color:#b77d3c}
.answer.correct{background:linear-gradient(#d2f5c9,#8ec88c);color:#245633;border-color:#44885b}
.answer.wrong{background:linear-gradient(#ffdfcc,#e6a28c);color:#873e2e;border-color:#b46b57}
.tool,.small-button{background:linear-gradient(#71503a,#493024);color:#ffe5b5;border:2px solid #c08d58;border-bottom:5px solid #281c1a;border-radius:12px;font-weight:900}
.tool:hover,.small-button:hover{filter:brightness(1.17)}
.primary{background:linear-gradient(#ffe3a0,#d9a14f);color:#50331e;border:3px solid #f7d18a;border-bottom:7px solid #93602e;border-radius:13px;font-weight:1000}
.primary:hover:not(:disabled){filter:brightness(1.1)}
.feedback{background:#e7cf9b;color:#543b29;border:2px solid #a98050;border-radius:13px}
.name-entry,.extra-panel{background:linear-gradient(155deg,#62412d,#382720);color:#ffe6b9;border:4px solid #c09057;border-radius:19px;box-shadow:0 12px 35px #000b,inset 0 0 0 2px #d7a86944}
.name-entry .muted,.extra-panel .muted{color:#f5d9ae;text-shadow:none}
.name-input{background:#fff0ca;color:#513622;border:2px solid #d1a06a}
.grade-option span,.mascot-option{background:#78523a;color:#ffe2b1;border:2px solid #bd8e59}
.grade-option input:checked+span,.mascot-option[aria-pressed=true]{background:#d9a963;color:#4d2e1d;border-color:#ffe3a7}
.endstats>div{background:#eed5a3;color:#573d29;border:2px solid #b7864f}
.endstats span{color:#7c583c}.hintbox{background:#fff0bc;color:#6a4826;border:2px solid #b98a4a}
.fun-mode button{background:#715039;color:#ffe2b0;border:2px solid #bf8e58}
.fun-mode button.active{background:#e8c788;color:#563a25;border-color:#f6e0a6}
.fun-combo{background:#e6ae5e;color:#50321b;border:2px solid #ffe1a1}
.explorer-delete{background:#a5584e;color:#fff0dd;border:2px solid #e4a18c}
.footer{color:#ffe4af;text-shadow:0 2px 6px #000;line-height:1.6}
button:focus-visible{outline:4px solid #ffe09a;outline-offset:3px}
@media(max-width:700px){.app{padding:10px 12px 35px}.top{padding:14px 15px}.screen{margin-top:20px}.subjects{gap:10px}.subject{min-height:149px;padding:14px}.subject .emoji{width:50px;height:50px;font-size:29px}.subject .label{font-size:19px}.card{padding:16px 12px;border-width:6px}.card:before{inset:8px}.card:after{top:8px}.answer{min-height:84px;padding:12px}.world-scene{background-position:center}}

let mascotIndex=0;
const CUSTOM_PHOTO_INDEX=6;
let pendingAvatarPhoto='';
const avatarPhotoKey=(name,level)=>'little_lab_custom_photo_'+encodeURIComponent(name||'')+'_'+encodeURIComponent(level||'');
const getAvatarPhoto=(name,level)=>{try{return localStorage.getItem(avatarPhotoKey(name,level))||''}catch{return ''}};
const avatarPlaceholder='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="22" fill="#71503c"/><text x="60" y="76" font-size="60" text-anchor="middle">📷</text></svg>');
const mascotURL=(i,name=player,level=grade)=>i===CUSTOM_PHOTO_INDEX?(getAvatarPhoto(name,level)||pendingAvatarPhoto||avatarPlaceholder):(MASCOTS[i]||MASCOTS[0]).src;
const mascotImage=(i,cls='mascot-img',name=player,level=grade)=>`<img class="${cls}${i===CUSTOM_PHOTO_INDEX?' personal-photo':''}" src="${mascotURL(i,name,level)}" alt="${i===CUSTOM_PHOTO_INDEX?'내 사진':(MASCOTS[i]||MASCOTS[0]).name} 캐릭터" draggable="false">`;
async function processAvatarPhoto(file){
 if(!file||!file.type.startsWith('image/'))throw Error('사진 파일을 선택해 주세요.');
 const img=await createImageBitmap(file);const side=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=320;
 const ctx=c.getContext('2d');ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,320,320);img.close?.();
 return c.toDataURL('image/jpeg',.78);
}
async function onAvatarPhotoSelected(file,forExisting=false){
 try{const photo=await processAvatarPhoto(file);if(forExisting){localStorage.setItem(avatarPhotoKey(player,grade),photo);mascotIndex=CUSTOM_PHOTO_INDEX;registerExplorer(player,grade,mascotIndex);dressPage();}
 else{pendingAvatarPhoto=photo;mascotIndex=CUSTOM_PHOTO_INDEX;document.querySelectorAll('[data-mascot]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.mascot)===mascotIndex)));const preview=document.querySelector('[data-mascot="6"] img');if(preview)preview.src=photo;}}
 catch(e){alert('사진을 저장하지 못했어. 다른 사진으로 다시 시도해 줘. '+(e?.message||''));}
}

function speakExplanation(t,onFinished){

 try{

   if(!ttsVoices.length)refreshVoices();

  const done=()=>{if(completed)return;completed=true;onFinished()};

  const fallback=setTimeout(done,Math.max(6000,cleanSpeechText(t).length*230));

   u.lang=part.lang;u.rate=speechRate(part.lang);u.pitch=1;

   if(i===parts.length-1){u.onend=()=>{clearTimeout(fallback);done()};u.onerror=()=>{clearTimeout(fallback);done()}}

function buildHelpfulHints(item){

 // First clue teaches a strategy; the second gives a concrete, question-specific clue.

  else if(/[\-−－]/.test(op)){first=`${a}개에서 ${b}개를 없애는 상황을 떠올려 보자.`;second=`${a}부터 ${b}번 뒤로 세어 보자. 남은 개수를 고르면 돼.`}

  else {first=`${a}개를 ${b}명에게 똑같이 나누어 주는 장면을 떠올려 보자.`;second=`한 명씩 차례로 나누어 주고, 한 사람이 몇 개 받는지 세어 보자.`}
 }else if(cat==='논리·추리 탐험'){
  const numbers=[...question.matchAll(/\d+(?:\.\d+)?/g)].map(x=>Number(x[0]));
  if(numbers.length>=3){const diffs=numbers.slice(1).map((n,i)=>n-numbers[i]);first=`앞의 수들이 어떻게 바뀌는지 비교해 보자. ${numbers[0]}에서 ${numbers[1]}로 변했어.`;second=diffs.every(x=>x===diffs[0])?`매번 ${Math.abs(diffs[0])}씩 ${diffs[0]>=0?'커지고':'작아지고'} 있어. 같은 규칙을 한 번 더 적용해 보자.`:`차이를 차례대로 비교해 봐. ${diffs.slice(0,3).map(n=>(n>=0?'+':'')+n).join(', ')} 순서로 변했어.`}
  else {first='반복되는 순서를 앞에서부터 두 개씩 묶어 보자.';second=explanation?`이 설명에서 규칙을 찾아보자. ${explanation.replace(new RegExp(correct.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'어떤 것')}`:'앞에 나온 모양의 순서를 그대로 이어서 생각해 보자.'}
 }else if(cat==='영어'){

  second=explanation?`뜻을 찾을 때 이 설명을 참고해 봐. ${explanation.replaceAll(correct,'빈칸')}`:`보기의 단어를 하나씩 소리 내어 읽고, 문제의 뜻과 맞는지 비교해 보자.`;
 }else if(cat==='국기'){

 }else if(cat==='수도'){
  first='문제에 나온 나라를 먼저 찾고, 보기 중 도시 이름을 골라 보자.';
  second='수도는 나라의 중심 도시야. 보기 중 다른 나라에 있는 도시를 먼저 제외해 보자.';
 }else if(cat==='한자'){

 }else if(cat==='속담'){

 }else{

  second=explanation?`문제를 푸는 단서야. ${explanation.replaceAll(correct,'정답에 해당하는 것')}`:'보기마다 문제의 조건에 맞는지 하나씩 확인해 보자.';
 }
 // If the source explanation directly reveals the answer, do not use it as a hint.
 if(second.includes(correct) && correct.length>=2)second='보기 중 문제의 조건과 맞지 않는 선택지를 먼저 제외해 보자.';

function profiles(){clearTimeout(advanceTimer);clearTimeout(questionSpeechTimer);stopSpeak();player=null;grade=null;home.style.display='none';const list=getExplorers().sort((a,b)=>(b.lastUsed||0)-(a.lastUsed||0));setScreen(`<section class="screen"><div class="eyebrow">WELCOME BACK!</div><h1 class="hero">꼬마 탐험 연구소 🌟</h1><p class="muted">처음이라면 새로 만들기, 전에 공부했다면 내 이름을 골라 로그인해!</p><div class="extra-panel"><h3>👋 로그인 · 이어서 탐험하기</h3>${list.length?`<div class="profiles">${list.map(a=>{const i=getExplorers().findIndex(x=>x.name===a.name&&x.grade===a.grade);return `<button class="profile" data-login="${i}" style="padding:16px;min-height:125px">${mascotImage(Number(a.mascot)||0,'mascot-img',a.name,a.grade)}<div><b>${escapeHTML(a.name)}</b><div class="small muted">${escapeHTML(a.grade)} · 이어서 하기 ▶</div></div></button>`}).join('')}</div>`:'<p class="muted">아직 등록한 탐험가가 없어. 아래에서 첫 탐험가를 만들어 봐!</p>'}</div><button class="primary" id="newExplorer" style="width:100%;margin-top:18px">➕ 새로 만들기</button><p class="small muted">로그인은 비밀번호 없이 이 기기에 저장된 이름을 선택하는 방식이야. 다른 기기에서는 백업 파일을 복원해야 기록을 옮길 수 있어.</p></section>`);document.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>enterExplorer(Number(b.dataset.login)));document.getElementById('newExplorer').onclick=createProfilePage}

/* 프로필 삭제: 저장된 기록까지 삭제할지 선택, 보호자 PIN이 설정되었다면 확인 */
function deleteExplorerProfile(name,level){
 const settings=loadSettings();
 if(settings.pin){let input=prompt('보호자 비밀번호 4자리를 입력해 주세요.');if(input===null)return;if(input!==String(settings.pin)){alert('비밀번호가 일치하지 않아요.');return}}
 const full=confirm('['+name+' · '+level+'] 탐험가를 삭제할까요?\n\n확인: 학습 기록까지 영구 삭제\n취소: 삭제하지 않음');
 if(!full)return;
 if(!confirm('마지막 확인: '+name+'의 별, 오답, 업적, 학습 리포트도 삭제됩니다. 복구할 수 없어요. 계속할까요?'))return;
 const list=getExplorers().filter(a=>!(a.name===name&&a.grade===level));
 try{
  const keys=[];for(let i=0;i<localStorage.length;i++){let key=localStorage.key(i);if(key)keys.push(key)}
  for(const key of keys){
   if(key==='astra_stats_'+name+'_'+level||key==='astra_learning_v4_'+name+'_'+level||key==='little_lab_extra_v2_'+name+'_'+level||key==='little_lab_settings_'+name||key==='little_lab_mascot_'+name){
    if((key==='little_lab_mascot_'+name||key==='little_lab_settings_'+name) && list.some(a=>a.name===name))continue;
    localStorage.removeItem(key);
   }
  }
  // 다른 버전에서 생성한 프로필별 데이터도 해당 계정에만 한정하여 정리
  localStorage.setItem(EXPLORERS_KEY,JSON.stringify(list));
 }catch(e){alert('삭제 중 저장소 오류가 발생했어요. 다시 확인해 주세요.');return}
 profiles();
}
const previousProfiles=profiles;
profiles=function(){previousProfiles();const list=getExplorers().sort((a,b)=>(b.lastUsed||0)-(a.lastUsed||0));
 const cards=document.querySelectorAll('[data-login]');cards.forEach((card,j)=>{const a=list[j];if(!a)return;const wrap=document.createElement('div');wrap.className='explorer-login-card';card.parentNode.insertBefore(wrap,card);wrap.appendChild(card);const del=document.createElement('button');del.type='button';del.className='explorer-delete';del.textContent='🗑️ 삭제';del.setAttribute('aria-label',a.name+' 프로필 삭제');del.onclick=()=>deleteExplorerProfile(a.name,a.grade);wrap.appendChild(del)});
};

document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeak()});profiles();

/* 2차 확장: 오프라인 탐험 지도, 업적, 보스, 협동, 문제 유형, 오답 노트 */
const STAGES=[['🌳','반짝 숲'],['🌊','푸른 바다'],['🏰','구름 성'],['🚀','별빛 우주']];
let phaseMode='',coopNames=[],roundStartAt=0,restShown=false;
const phaseData=()=>loadExtra();
function stageUnlocked(){return Math.min(4,1+(phaseData().bossWins||0))}
function phaseSave(obj){saveExtra({...loadExtra(),...obj})}
function phaseCard(){let d=phaseData(),unlocked=stageUnlocked();return `<div class="extra-panel"><h3>🗺️ 모험 지도 · 스테이지</h3><div class="extra-grid">${STAGES.map(([icon,name],i)=>`<button class="tool" data-stage="${i}" ${i>=unlocked?'disabled':''}>${icon} ${name} ${i>=unlocked?'🔒':'✓'}</button>`).join('')}</div><p class="small">보스 퀴즈를 통과하면 다음 지역이 열려요. 현재 ${unlocked}/4 지역 개방</p><div class="toolbar"><button class="tool" id="bossStart">👑 보스 퀴즈 (5문제)</button><button class="tool" id="coopStart">🤝 형제자매 협동</button><button class="tool" id="badgeOpen">🏅 업적 배지</button><button class="tool" id="noteOpen">📖 나만의 오답 노트</button></div></div>`}
const oldMenuPhase=menu;
menu=function(){phaseMode='';coopNames=[];oldMenuPhase();};
const oldStartPhase=start;
start=function(s){let mode=phaseMode;oldStartPhase(s);phaseMode=mode;roundStartAt=Date.now();restShown=false;if(mode==='boss'){session=session.slice(0,5);index=0;score=0;streak=0;showQuestion()}else if(mode==='coop'){session=session.slice(0,20);showQuestion()}};
function coopSetup(){setScreen(`<section class="screen"><h1 class="hero">🤝 함께하는 탐험</h1><div class="extra-panel"><p>두 명이 한 문제씩 번갈아 풀어 별을 함께 모아요. 서로 도와줘도 좋아요!</p><label>첫 번째 탐험가 <input id="co1" class="name-input" value="${escapeHTML(player)}" maxlength="10"></label><label>두 번째 탐험가 <input id="co2" class="name-input" placeholder="예: 나나" maxlength="10"></label><div class="toolbar"><button class="primary" id="coGo">협동 탐험 시작</button><button class="tool" id="coBack">돌아가기</button></div></div></section>`);document.getElementById('coBack').onclick=menu;document.getElementById('coGo').onclick=()=>{let a=document.getElementById('co1').value.trim(),b=document.getElementById('co2').value.trim();if(!/^[가-힣]{1,10}$/.test(a)||!/^[가-힣]{1,10}$/.test(b)){alert('두 명의 한글 이름을 입력해 줘.');return}coopNames=[a,b];phaseMode='coop';start('종합 탐험')}}
function earnedBadges(){let stats=readStats(player),x=loadExtra(),h=x.history||[],d=x.daily||{},cats=new Set(h.map(v=>v.cat));return [['🌱','첫 탐험',stats.played>=1],['⭐','별 30개',stats.stars>=30],['🌟','별 100개',stats.stars>=100],['🧠','100문제 도전',h.length>=100],['📚','7과목 탐험',cats.size>=7],['🩹','오답 복습',h.some(v=>v.review)],['🏆','첫 보스 통과',(x.bossWins||0)>=1],['🗺️','모험 지도 정복',(x.bossWins||0)>=3],['🎯','5일 공부',Object.keys(d).filter(k=>d[k].attempts>0).length>=5],['💯','정답 50개',h.filter(v=>v.correct).length>=50]]}
function badgesPage(){let list=earnedBadges();setScreen(`<section class="screen"><h1 class="hero">🏅 업적 배지 수집</h1><p class="muted">달성한 업적 ${list.filter(v=>v[2]).length}/${list.length}개</p><div class="extra-grid">${list.map(([e,t,ok])=>`<div class="extra-panel" style="opacity:${ok?1:.48};text-align:center"><div style="font-size:42px">${ok?e:'🔒'}</div><b>${t}</b><p class="small">${ok?'달성했어!':'아직 도전 중'}</p></div>`).join('')}</div><button class="primary" id="backMenu">돌아가기</button></section>`);document.getElementById('backMenu').onclick=menu}
function allQuestionItems(){return Object.entries(GRADE_DATA[grade]).flatMap(([cat,arr])=>arr.map(raw=>({cat,raw,id:questionId(cat,raw)})))}
function notePage(){let learning=readLearning(),items=allQuestionItems().filter(i=>(learning[i.id]?.wrong||0)>0);setScreen(`<section class="screen"><h1 class="hero">📖 나만의 오답 노트</h1><p class="muted">틀렸던 문제 ${items.length}개 · 문제와 설명을 다시 살펴봐요.</p><div class="extra-panel">${items.length?items.slice(0,100).map((i,j)=>`<details class="setting-row"><summary>${icons[i.cat]} ${escapeHTML(i.raw[0])}</summary><p>정답: <b>${escapeHTML(i.raw[1][i.raw[2]])}</b></p><p>${escapeHTML(i.raw[3])}</p></details>`).join(''):'아직 틀린 문제가 없어요. 멋져요!'}</div><div class="toolbar"><button class="primary" id="notePractice" ${!items.length?'disabled':''}>오답 노트 다시 풀기</button><button class="tool" id="backMenu">돌아가기</button></div></section>`);document.getElementById('backMenu').onclick=menu;document.getElementById('notePractice').onclick=()=>{phaseMode='notes';subject='오답 노트';score=0;streak=0;index=0;reviewQueue=[];reviewMode=true;reviewCompleted=0;session=shuffle(items).slice(0,20);showQuestion()}}
function pictureLabel(s){const m={'사과':'🍎','토끼':'🐰','고양이':'🐱','강아지':'🐶','기차':'🚂','수박':'🍉','나무':'🌳','해':'☀️','달':'🌙','별':'⭐','물':'💧','불':'🔥','책':'📚','연필':'✏️','자동차':'🚗','바나나':'🍌','딸기':'🍓','우유':'🥛','물고기':'🐟','새':'🐦','꽃':'🌷','의자':'🪑','모자':'🧢','구름':'☁️'};return m[s]||''}
const oldShowPhase=showQuestion;
showQuestion=function(){oldShowPhase();let item=session[index];if(!item)return;let question=document.getElementById('question');if(!question)return;let box=document.querySelector('.card');if(phaseMode==='boss')question.insertAdjacentHTML('beforebegin','<div class="eyebrow">👑 보스 퀴즈 · 천천히 풀어도 괜찮아!</div>');if(phaseMode==='stage')question.insertAdjacentHTML('beforebegin',`<div class="eyebrow">${STAGES[loadExtra().stage||0].join(' ')}</div>`);if(phaseMode==='coop'&&coopNames.length)question.insertAdjacentHTML('beforebegin',`<div class="eyebrow">🤝 ${escapeHTML(coopNames[index%2])} 차례! · 함께 모은 별 ${score}</div>`);
// OX 문항은 발음 지연을 줄이기 위해 생성하지 않습니다. 기존 객관식과 빈칸 선택형은 유지합니다.
let q=item.raw;
if(!reviewMode&&index%5===4&&q[1].length===4){question.textContent='알맞은 답을 골라 봐. '+q[0]+' → ______';}
if(['국어','영어','한자'].includes(item.cat)&&grade==='유치원'){document.querySelectorAll('[data-answer]').forEach(b=>{let icon=pictureLabel(b.textContent.trim());if(icon)b.innerHTML=`<span style="font-size:36px;display:block">${icon}</span>${b.innerHTML}`})}
if(!restShown&&Date.now()-roundStartAt>12*60*1000&&index>0){restShown=true;clearTimeout(questionSpeechTimer);stopSpeak();box.insertAdjacentHTML('afterbegin',`<div class="extra-panel" id="restBanner"><b>🌿 잠깐 눈을 쉬어 볼까?</b><p>12분 동안 열심히 했어! 멀리 보고 스트레칭한 뒤 계속하자.</p><button class="tool" id="restContinue">계속 공부하기</button></div>`);document.getElementById('restContinue').onclick=()=>document.getElementById('restBanner').remove()}
};
const oldAnswerPhase=answer;
answer=function(n){let item=session[index],wasCorrect=!!item?.choices[n]?.correct;if(item?.originalRaw){/* 원본 문항 ID를 유지해 학습 기록과 오답 노트를 연결 */}
oldAnswerPhase(n);if(wasCorrect&&phaseMode==='coop'&&coopNames.length){let r=document.querySelector('.feedback strong');if(r)r.textContent='정말 잘했어! 🌟'}
};
const oldFinishPhase=finish;
finish=function(){let mode=phaseMode,win=mode==='boss'&&score>=3;if(win){let x=loadExtra();phaseSave({bossWins:Math.min(3,(x.bossWins||0)+1)})}oldFinishPhase();if(mode==='boss'){let card=document.querySelector('.card');if(card)card.insertAdjacentHTML('afterbegin',`<h2>${win?'👑 보스 클리어! 새로운 지역이 열렸어!':'🌱 보스에게 다시 도전해 보자!'}</h2><p>보스 퀴즈는 5문제 중 3문제 이상 정답이면 통과해.</p>`)}if(mode==='coop'){let card=document.querySelector('.card');if(card)card.insertAdjacentHTML('afterbegin',`<h2>🤝 ${coopNames.map(escapeHTML).join('와 ')}의 협동 탐험 완료!</h2><p>함께 모은 별: ${score}개</p>`)}phaseMode=''};

/* Individual grade question banks. The original four banks are preserved, and
   split by reading/concept complexity. Existing grade-labelled profiles remain valid. */
const ORIGINAL_GRADE_BANKS={...GRADE_DATA};
function readingComplexity(raw){
 const q=String(raw[0]||''),opts=raw[1]||[],ex=String(raw[3]||'');
 const length=q.replace(/\s/g,'').length;
 const complexWords=/본초자오선|민주주의|삼국|고려|조선|독립|문화재|경도|위도|광합성|증발|비례|분수|소수|원인|결과|추론|확률|유추|역사|상징|암행어사|공양미|인당수|수도|제곱|방정식/;
 return length+Math.max(0,...opts.map(x=>String(x).length))*0.55+(complexWords.test(q)?18:0)+(q.includes('아닌')?7:0)+(q.includes('옳지')?7:0)+(q.includes('모두')?5:0)+(q.includes('가장')?2:0);
}
function splitBank(base,lowName,highName){
 GRADE_DATA[lowName]={};GRADE_DATA[highName]={};
 for(const [subject,items] of Object.entries(ORIGINAL_GRADE_BANKS[base])){
  const ranked=[...items].sort((a,b)=>readingComplexity(a)-readingComplexity(b));
  const half=Math.ceil(ranked.length/2);
  // Overlap preserves adequate question variety for 20-question adventures.
  GRADE_DATA[lowName][subject]=ranked.slice(0,Math.max(half,Math.ceil(ranked.length*.7)));
  GRADE_DATA[highName][subject]=ranked.slice(Math.max(0,Math.floor(ranked.length*.3)));
 }
}

function getGradeBank(level){return GRADE_DATA[level]||ORIGINAL_GRADE_BANKS[level]||ORIGINAL_GRADE_BANKS['유치원']}
const GRADE_PREVIOUS={'초1':'유치원','초2':'초1','초3':'초2','초4':'초3','초5':'초4','초6':'초5'};
function easyQuestionPool(level,subject){
 const bank=getGradeBank(level),base=bank[subject]||[];
 const prior=GRADE_PREVIOUS[level],easier=prior?(getGradeBank(prior)[subject]||[]):[];
 // Ten percent of each session comes from the previous level; the remaining
 // ninety percent stays grade-appropriate. Kindergarten gets the simplest
 // questions first, rather than mixing in harder material.
 return {base,easier};
}

 const easedIndices=new Set(Array.from({length:easedCount},(_,k)=>
   Math.min(session.length-1,Math.floor((k+0.5)*session.length/easedCount))));
 if(!easedIndices.has(index))return;
 const item=session[index],options=item?.choices;

 // Preserve the existing shuffled order of the two surviving options.
 const distractor=distractors[(index+session.length)%distractors.length];

 item.choices=kept;
 const answerBox=document.querySelector('.answers');
 if(!answerBox)return;
 answerBox.innerHTML=kept.map((o,i)=>`<button class="answer" data-answer="${i}">${escapeHTML(o.label)}</button>`).join('');

const tavernGlossary=[
 ['본초자오선','지구를 동쪽과 서쪽으로 나눌 때 기준으로 삼는 가상의 세로선이야. 영국 런던 근처의 그리니치를 지나고, 경도 0도라고 정했어.','커다란 지구본에 세로로 줄을 그었다고 생각해 봐. 그중 출발점이 되는 줄이 본초자오선이야.','실제로 땅에 그어진 선은 아니야. 나라들이 위치를 쉽게 말하려고 약속한 기준선이야.'],

function tavernDeepGuide(item){
 const q=item.raw,question=String(q[0]||''),explain=String(q[3]||''),correct=String(q[1][q[2]]||''),cat=item.cat;
 const combined=[question,explain,correct].join(' ');
 const matched=tavernGlossary.find(x=>combined.includes(x[0]));
 const base=childFriendlyExplanation(item,q);
 let simple='',example='',why='';
 if(matched){
  simple=`'${matched[0]}'은(는) ${matched[1]}`;
  example=matched[2];
  why=`${matched[3]} 이 문제의 정답은 '${correct}'이야. ${explain}`;
 }else if(cat==='산수'){
  const m=question.match(/(\d+)\s*([+＋\-−－×✕*÷/])\s*(\d+)/);
  if(m){const a=+m[1],b=+m[3],op=m[2];
   simple=/[+＋]/.test(op)?'더하기는 있던 것에 더 모으는 계산이야.':/[-−－]/.test(op)?'빼기는 있던 것에서 일부를 덜어 내는 계산이야.':/[×✕*]/.test(op)?'곱하기는 같은 수를 여러 번 더하는 계산이야.':'나누기는 여러 사람에게 똑같이 나누어 주는 계산이야.';
   example=/[+＋]/.test(op)?`사탕 ${a}개가 있고 ${b}개를 더 받는 장면을 떠올려 봐.`:/[-−－]/.test(op)?`사탕 ${a}개에서 ${b}개를 먹으면 몇 개가 남을까?`:/[×✕*]/.test(op)?`${b}개씩 ${a}묶음을 그려서 세어 보자.`:`사탕 ${a}개를 ${b}명에게 하나씩 돌아가며 나누어 주자.`;
  }
 }else if(cat==='국기'){simple='국기는 나라를 나타내는 특별한 그림이야. 색과 무늬가 나라를 구별하는 단서가 돼.';example='국기를 볼 때 줄무늬가 있는지, 별이나 원이 있는지 먼저 찾아보자.'}
 else if(cat==='수도'){simple='수도는 한 나라의 정부가 중요한 일을 하는 중심 도시야.';example='대한민국의 수도는 서울이야. 다른 나라들도 각자의 수도가 있어.'}
 else if(cat==='한국사'){simple='역사는 옛날 사람들이 겪은 일을 알아보는 공부야. 누가, 언제, 왜 그런 일을 했는지 연결해 보면 이해하기 쉬워.';example='이 사건이 일어나기 전과 후에 무엇이 달라졌는지 이야기처럼 생각해 보자.'}
 else if(cat==='영어'){simple='영어 단어는 뜻과 함께 실제로 쓰는 장면을 떠올리면 기억하기 쉬워.';example=`정답 '${correct}'을(를) 일상에서 어떤 상황에 쓰는지 떠올려 보자.`}
 else if(cat==='과학'){simple='과학은 주변에서 일어나는 일을 관찰하고 이유를 찾아보는 공부야.';example='이 현상을 집이나 학교에서 본 적이 있는지 생각해 보자.'}
 else if(cat==='논리·추리 탐험'){simple='추리는 눈에 보이는 단서를 모아 규칙을 찾아내는 거야.';example='앞에서부터 하나씩 비교하고, 달라지는 부분을 찾아보자.'}
 else {simple='문제에 나온 중요한 말의 뜻을 먼저 이해하면 정답을 찾기 쉬워.';example=`문제에서 묻는 핵심 표현을 찾아서 '${correct}'과(와) 어떻게 연결되는지 생각해 보자.`}
 why=why||`${base} ${explain&& !base.includes(explain)?explain:''}`.trim();
 return {simple,example,why,word:matched?.[0]||null,definition:matched?.[1]||null,correct};
}

function wordFirstGuide(item){
 const q=item.raw||[],question=String(q[0]||''),correct=String(q[1]?.[q[2]]||''),original=String(q[3]||'');
 const text=[question,correct,original].join(' ');
 // Prefer words from the actual question; do not teach an unrelated term from an answer choice.
 const hits=easyWords.filter(x=>question.includes(x[0])||correct.includes(x[0]));
 const additional=easyWords.filter(x=>!hits.includes(x)&&original.includes(x[0]));
 const terms=[...hits,...additional].slice(0,2);
 let definition,example;
 if(terms.length){
  definition=terms.map(x=>`${x[0]}이라는 말을 알아보자. ${x[1]}`).join(' ');
  example=terms.map(x=>x[2]).join(' ');
 }else{
  const guide=tavernDeepGuide(item);
  definition=`먼저 문제에 나온 말을 쉽게 풀어 볼게. ${guide.simple}`;
  example=guide.example;
 }
 // For idioms, explicitly unpack literal words and figurative meaning.
 if(/백지장도\s*맞들면\s*낫다/.test(text)){
  definition='백(白)은 하얗다, 지(紙)는 종이, 장(張)은 한 장을 세는 말이야. 백지장은 하얀 종이 한 장이야. 맞들다는 두 사람이 양쪽에서 함께 들어 준다는 뜻이야. 낫다는 더 좋거나 쉬워진다는 뜻이야.';
  example='종이 한 장은 아주 가볍지? 그런데 그런 쉬운 일도 친구와 함께하면 더 수월할 수 있다는 말이야. 서로 돕고 힘을 모으자는 뜻이지.';
 }
 const why=`그래서 이 문제의 정답은 ${correct}이야. ${original}`.trim();
 return {definition,example,why};
}

 ];

  const node=document.getElementById('wordStep'+i);

function shortWordMeaning(item){
 const q=item.raw||[],question=String(q[0]||''),correct=String(q[1]?.[q[2]]||''),original=String(q[3]||'');
 const context=[question,correct,original].join(' ');
 const idiom=literalSayingMeanings.find(x=>x[0].test(context));
 if(idiom)return `${idiom[1]} ${idiom[2]}`;
 const terms=easyWords.filter(x=>question.includes(x[0])||correct.includes(x[0]));
 if(terms.length){const t=terms[0];return `${t[1]} ${t[2]}`;}
 // Avoid claiming to define an unknown term. Give the existing question-specific explanation instead.
 const base=original.trim();
 if(base)return `정답은 ${correct}이야. ${base}`;
 return `정답은 ${correct}이야.`;
}

shortWordMeaning=function(item){
 const q=item?.raw||[],question=String(q[0]||''),correct=String(q[1]?.[q[2]]||''),original=String(q[3]||'').trim();
 if(item?.cat==='국기')return previousDirectExplanation(item);
 const known=historyDirectReasons.find(x=>x[0].test(question));
 if(known)return known[1];
 // For questions that ask which option is NOT true, start with the concrete contrast.
 if(/아닌 것은|않는 것은|틀린 것은|해당하지 않는/.test(question)){
  if(original)return `${correct}이 정답인 이유는 이거야. ${original}`;
  return `${correct}이 정답이야. 문제는 해당하지 않는 것을 찾으라고 했어.`;
 }
 // For other questions, use the question-specific original explanation ahead of generic word definitions.
 if(original && !/이\(가\) 정답이에요\.?$/.test(original))return `${correct}이 정답이야. ${original}`;
 return previousDirectExplanation(item);
};

const earlierMemoryExplanation=shortWordMeaning;
function memoryExplanation(item){
 const q=item?.raw||[],question=String(q[0]||''),correct=String(q[1]?.[q[2]]||''),original=String(q[3]||'').trim();
 const category=String(item?.cat||'');
 // Preserve flag-specific, evidence-based symbolism from the previous version.
 if(category==='국기')return earlierMemoryExplanation(item);
 const hit=memoryLinks.find(x=>(x.cat===category||((x.cat==='속담')&&category.includes('속담')))&&x.re.test(question));
 if(hit)return `${hit.meaning} ${hit.scene} ${hit.reason} ${hit.hook}`;
 // When the old question bank contains a useful specific reason, prefer it.
 const older=earlierMemoryExplanation(item);
 const generic=/^(정답은\s*.+?(?:이야|예요|이에요)\.?\s*)?(?:《[^》]+》에서\s*)?.{1,50}이\(가\) 정답이에요\.?$/;
 if(older&& !generic.test(older)&& !/이\(가\) 정답이에요/.test(older))return older;
 // Avoid falsely inventing a story or meaning. Use only what the bank actually supports.
 if(original&&!/이\(가\) 정답이에요/.test(original))return `${original} 이 내용과 정답인 ${correct}을 연결해서 기억해 보자.`;
 return `${correct}이 정답이야. 이 문제에는 아직 단어의 뜻과 이야기를 연결한 자세한 해설이 준비되지 않았어.`;
}
shortWordMeaning=memoryExplanation;

/* During a completed answer, Skip immediately stops the explanation and advances. */
(function(){
 let skipBusy=false;
 document.addEventListener('click',function(event){
  const button=event.target.closest?.('#skip, #skipExplanation');
  if(!button || !answered || !session?.[index])return;
  event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
  if(skipBusy)return;
  skipBusy=true;
  clearTimeout(advanceTimer);
  clearTimeout(questionSpeechTimer);
  if(typeof wordFirstFallback!=='undefined')clearTimeout(wordFirstFallback);
  stopSpeak();
  next();
  // Release the guard after the next question is mounted.
  skipBusy=false;
 },true);
})();

/* Never show filler explanations. If there is no useful teaching point, advance quietly. */
const meaningfulExplanationBefore=shortWordMeaning;
shortWordMeaning=function(item){
 const q=item?.raw||[];
 const correct=String(q[1]?.[q[2]]??'').trim();
 const original=String(q[3]||'').trim();
 const msg=String(meaningfulExplanationBefore(item)||'').trim();
 const filler=[
  /자세한 해설이 준비되지 않았어/,
  /이 문제에는 아직.*해설/,
  /정답은 .+?(?:이야|예요|이에요)\.?\s*$/,
  /.+이\(가\) 정답이에요\.?\s*$/,
  /이 내용과 정답인 .+을 연결해서 기억해 보자/
 ];
 if(!msg||filler.some(re=>re.test(msg)))return '';
 // The source explanation can merely repeat the answer, without teaching anything.
 const plain=original.replace(/\s+/g,' ').trim();
 if(!plain||plain===`${correct}이(가) 정답이에요.`||plain===`${correct}가 정답이에요.`||plain===`${correct}이 정답이에요.`){
  if(msg===`정답은 ${correct}이야.`||msg===`정답은 ${correct}이야. ${plain}`)return '';
 }
 return msg;
};
const meaningfulTavernTeachBefore=tavernTeach;
tavernTeach=function(item){
 if(shortWordMeaning(item))return meaningfulTavernTeachBefore(item);
 // Don't render a meaningless explanation box or narrate filler.
 clearTimeout(wordFirstFallback);
 stopSpeak();
 const response=document.getElementById('response');
 if(response)response.innerHTML='';
 const at=index;
 wordFirstFallback=setTimeout(()=>{if(index===at&&answered)next()},650);
};

/* 문제별 연속 정답 3회: 이후 일반 탐험 출제에서 영구 제외 (학습 기록 유지). */
const masterySelectBefore=selectQuestions;
selectQuestions=function(cat,count,learning){
 const eligible=item=>item && (Number(learning[item.id]?.consecutiveCorrect)||0)<3;
 const selected=masterySelectBefore(cat,count,learning).filter(eligible);
 const ids=new Set(selected.map(x=>x.id));
 if(selected.length<count){
  const pools=easyQuestionPool(grade,cat);
  const all=[...(pools.base||[]),...(pools.easier||[])];
  const recent=loadExtra().recent||[];
  const extra=[...new Map(all.map(raw=>{const id=questionId(cat,raw);return [id,{cat,raw,id}]})).values()]
   .filter(x=>eligible(x)&&!ids.has(x.id));
  extra.sort((a,b)=>(Number(recent.includes(a.id))-Number(recent.includes(b.id)))||((learning[a.id]?.seen||0)-(learning[b.id]?.seen||0)));
  for(const item of extra){if(selected.length>=count)break;selected.push(item);ids.add(item.id)}
 }
 return selected.slice(0,count);
};
const masteryAnswerBefore=answer;
answer=function(n){
 if(answered)return;
 const item=session?.[index];
 const correct=!!item?.choices?.[n]?.correct;
 const id=item?.id;
 masteryAnswerBefore(n);
 if(!id)return;
 const data=readLearning();
 const rec=data[id];
 if(!rec)return;
 rec.consecutiveCorrect=correct?(Number(rec.consecutiveCorrect)||0)+1:0;
 data[id]=rec;
 writeLearning(data);
};

/* Offline celebratory crowd + applause, or a gentle voiced sob. */
let quizSfxContext=null;
function playQuizFeedbackSound(isCorrect){
 try{
  if(typeof muted!=='undefined'&&muted)return;
  if(typeof loadSettings==='function'&&loadSettings().muted)return;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  if(!quizSfxContext)quizSfxContext=new AudioCtx();
  const ctx=quizSfxContext;
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const now=ctx.currentTime+0.015;
  const master=ctx.createGain();master.gain.value=0.52;master.connect(ctx.destination);
  function noiseBuffer(duration){
   const length=Math.ceil(ctx.sampleRate*duration),buffer=ctx.createBuffer(1,length,ctx.sampleRate),samples=buffer.getChannelData(0);
   for(let i=0;i<length;i++)samples[i]=Math.random()*2-1;
   return buffer;
  }
  function voice(start,duration,base,peak,volume,type='sawtooth'){
   const osc=ctx.createOscillator();osc.type=type;
   const formant=ctx.createBiquadFilter();formant.type='bandpass';formant.frequency.value=780+Math.random()*360;formant.Q.value=0.65;
   const gain=ctx.createGain();gain.gain.setValueAtTime(0.0001,start);
   gain.gain.linearRampToValueAtTime(volume,start+0.075);
   gain.gain.setValueAtTime(volume,start+Math.max(0.08,duration-0.15));
   gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
   osc.frequency.setValueAtTime(base,start);
   osc.frequency.linearRampToValueAtTime(peak,start+duration*0.45);
   osc.frequency.linearRampToValueAtTime(peak*0.88,start+duration);
   osc.connect(formant);formant.connect(gain);gain.connect(master);
   osc.start(start);osc.stop(start+duration+0.01);
  }
  if(isCorrect){
   // Layer irregular handclaps with rising 'woo!' crowd voices.
   const clap=noiseBuffer(0.11);
   for(let j=0;j<25;j++){
    const t=now+0.07+j*0.045+Math.random()*0.045;
    const src=ctx.createBufferSource();src.buffer=clap;
    const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=950+Math.random()*1700;filter.Q.value=0.7;
    const gain=ctx.createGain();gain.gain.setValueAtTime(0.0001,t);
    gain.gain.linearRampToValueAtTime(0.14+Math.random()*0.12,t+0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+0.105);
    src.connect(filter);filter.connect(gain);gain.connect(master);src.start(t);src.stop(t+0.11);
   }
   for(let j=0;j<5;j++)voice(now+0.02+j*0.12,0.66+Math.random()*0.2,180+j*33,280+j*55,0.045,'sawtooth');
  }else{
   // A small, wavering '흑...흐흑' vocal-style sob, rather than an electronic error beep.
   for(let j=0;j<3;j++){
    const t=now+j*0.30;
    const osc=ctx.createOscillator();osc.type='triangle';
    const trem=ctx.createOscillator();trem.type='sine';trem.frequency.value=7;
    const tremGain=ctx.createGain();tremGain.gain.value=13;
    trem.connect(tremGain);tremGain.connect(osc.frequency);
    osc.frequency.setValueAtTime(320-j*20,t);
    osc.frequency.linearRampToValueAtTime(410-j*25,t+0.09);
    osc.frequency.exponentialRampToValueAtTime(215-j*15,t+0.27);
    const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1100;
    const gain=ctx.createGain();gain.gain.setValueAtTime(0.0001,t);
    gain.gain.linearRampToValueAtTime(0.17,t+0.055);
    gain.gain.setValueAtTime(0.12,t+0.15);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    osc.connect(filter);filter.connect(gain);gain.connect(master);
    osc.start(t);osc.stop(t+0.29);trem.start(t);trem.stop(t+0.29);
   }
  }
 }catch(e){/* Keep quiz working if audio is unavailable. */}
}
const quizAnswerBeforeSfx=answer;
answer=function(n){
 if(answered)return;
 const correct=!!session?.[index]?.choices?.[n]?.correct;

<script>
/* A question cannot reappear until at least five OTHER questions have appeared.
   Persisted per learner + grade, across quiz sessions and page reloads. */
const fiveGapStorageKey=()=>`little_lab_last_questions_v1_${player}_${grade}`;
function fiveGapRead(){try{const x=JSON.parse(localStorage.getItem(fiveGapStorageKey())||'[]');return Array.isArray(x)?x.slice(-5):[]}catch{return []}}
function fiveGapWrite(ids){try{localStorage.setItem(fiveGapStorageKey(),JSON.stringify(ids.slice(-5)))}catch{}}
function fiveGapKey(item){return item?.id|| (item?.raw?questionId(item.cat,item.raw):'')}
const fiveGapSelectBefore=selectQuestions;
selectQuestions=function(cat,count,learning){
 const blocked=new Set(fiveGapRead());
 const chosen=fiveGapSelectBefore(cat,count,learning).filter(x=>!blocked.has(fiveGapKey(x)));
 const ids=new Set(chosen.map(fiveGapKey));
 const pools=easyQuestionPool(grade,cat);
 const candidates=[...new Map([...(pools.base||[]),...(pools.easier||[])].map(raw=>{const id=questionId(cat,raw);return [id,{cat,raw,id}]})).values()]
  .filter(x=>!blocked.has(x.id)&&!ids.has(x.id)&&(Number(learning[x.id]?.consecutiveCorrect)||0)<3);

};
const fiveGapShowBefore=showQuestion;
showQuestion=function(...args){
 if(!session?.length||index>=session.length){finish();return}
 const blocked=new Set(fiveGapRead());
 const current=fiveGapKey(session[index]);
 if(blocked.has(current)){
  const pos=session.findIndex((item,i)=>i>index&&!blocked.has(fiveGapKey(item)));
  if(pos>=0)[session[index],session[pos]]=[session[pos],session[index]];

};
